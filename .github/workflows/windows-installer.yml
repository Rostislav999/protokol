name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop.py
      - launch.py
      - app/**
      - assets/**
      - packaging/**
      - scripts/**
      - tests/**
      - requirements*.txt
      - requirements*.lock
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      test_failures: ${{ steps.test_report.outputs.failures }}
    env:
      # Hosted Windows redirects Python output using a Western code page unless
      # specified explicitly. OCR preparation and diagnostics contain Cyrillic.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-build.lock
      - name: Install verified build dependencies
        run: python -m pip install --require-hashes -r requirements-windows-build.lock
      - name: Prepare private OCR runtime
        shell: pwsh
        run: |
          python scripts/build_windows.py --prepare-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\build\windows\tesseract" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python scripts/prepare_ocr.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run application tests
        run: python -m pytest -q --junitxml=build/windows/tests.xml
      - name: Summarize failed application tests
        id: test_report
        if: failure()
        run: python -m scripts.report_test_failures
      - name: Check drafts and review in the native renderer
        run: python -m scripts.check_workspace_ui
      - name: Build installer and test installed application
        run: python scripts/build_windows.py --version 1.6.3
      - name: Upload installer and validation results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Protokol-Windows-Installer
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-build-diagnostics
          path: |
            build/windows/**/*.log
            build/windows/tests.xml
            build/windows/native-ui-*
            build/protokol/warn-protokol.txt
          if-no-files-found: ignore
          retention-days: 7

  test-failure-details:
    needs: build
    if: always() && needs.build.result == 'failure' && needs.build.outputs.test_failures != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.build.outputs.test_failures) }}
    name: "${{ matrix.test }} — ${{ matrix.reason }}"
    steps:
      - name: Failure details are shown in the job title
        run: exit 1
